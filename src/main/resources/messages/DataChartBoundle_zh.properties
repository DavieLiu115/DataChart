DataChart.plugin.description=<b>DataChart</b> \u662F\u4E00\u4E2A\u628A\u6570\u636E\u5E93\u8868\u7ED3\u6784\u53EF\u89C6\u5316\u7684\u4EA4\u4E92\u5F0F\u770B\u677F\u63D2\u4EF6\u3002<br>\n<ul>\n  <li>\u4ECE Database \u5DE5\u5177\u7A97\u53E3\u628A\u8868\u62D6\u5230\u753B\u5E03\u4E0A\uFF0C\u751F\u6210\u8868\u7ED3\u6784\u5361\u7247\uFF08\u5B57\u6BB5\u3001\u7C7B\u578B\u3001\u6CE8\u91CA\u3001\u4E3B\u952E / \u7D22\u5F15\u6807\u8BC6\uFF09</li>\n  <li>\u7528\u8FDE\u7EBF\u8868\u8FBE\u8868\u4E4B\u95F4\u7684\u5173\u8054\u5173\u7CFB\uFF08\u4E00\u5BF9\u4E00 / \u4E00\u5BF9\u591A / \u591A\u5BF9\u4E00 / \u591A\u5BF9\u591A\uFF09</li>\n  <li>\u652F\u6301\u753B\u5E03\u5E73\u79FB / \u7F29\u653E / \u5BF9\u9F50\u78C1\u5438\u3001\u5361\u7247\u641C\u7D22\u3001\u540C\u6B65\u8868\u7ED3\u6784</li>\n  <li>\u652F\u6301\u5728 SQL / XML \u6587\u4EF6\u4E2D\u67E5\u627E\u8868\u7684\u5F15\u7528\uFF0C\u5E76\u53EF\u8DF3\u8F6C\u5230 DDL / \u6570\u636E / Database Explorer</li>\n  <li>\u53EF\u5C06 ER \u56FE\u5BFC\u51FA\u4E3A PDF \u6216\u56FE\u7247\uFF0C\u652F\u6301\u6DF1\u8272 / \u6D45\u8272\u4E3B\u9898\u9002\u914D</li>\n</ul>\n\u770B\u677F\u5E03\u5C40\u4E0E\u8868\u5173\u7CFB\u4FDD\u5B58\u5728 <b>.datachart</b> \u6587\u4EF6\u4E2D\u3002
