# ===== plugin.xml (Plugin Manager / Marketplace) =====
DataChart.plugin.description=<b>DataChart</b> is a plugin that visualizes database table structures on an interactive board.<br>\n<ul>\n  <li>Drag database tables from the Database tool window onto the canvas to generate table-structure cards (columns, types, comments, primary-key / index markers)</li>\n  <li>Draw connections to express relationships between tables (one-to-one / one-to-many / many-to-one / many-to-many)</li>\n  <li>Canvas pan / zoom / snap alignment, card search, and table-structure synchronization</li>\n  <li>Find references of a table in SQL / XML files, and jump to DDL / data / Database Explorer</li>\n  <li>Export the ER diagram to PDF or image, with dark / light theme adaptation</li>\n</ul>\nBoard layout and table relationships are saved in a <b>.datachart</b> file.
DataChart.notification.group=DataChart

